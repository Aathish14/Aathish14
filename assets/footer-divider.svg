<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60">
  <defs>
    <linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main divider line -->
  <line x1="150" y1="30" x2="1050" y2="30" stroke="url(#dividerGradient)" stroke-width="1.5" filter="url(#softGlow)"/>
  
  <!-- Center glow accent -->
  <circle cx="600" cy="30" r="60" fill="url(#centerGlow)"/>
  
  <!-- Small accent dots -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="300" cy="30" r="2"/>
    <circle cx="900" cy="30" r="2"/>
    <circle cx="400" cy="28" r="1.5"/>
    <circle cx="800" cy="32" r="1.5"/>
    <circle cx="500" cy="30" r="1"/>
    <circle cx="700" cy="30" r="1"/>
  </g>
  
  <!-- Small decorative nodes at ends -->
  <g fill="#58a6ff" opacity="0.3">
    <circle cx="150" cy="30" r="3"/>
    <circle cx="1050" cy="30" r="3"/>
  </g>
</svg>