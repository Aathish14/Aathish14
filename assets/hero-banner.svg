<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="30%" stop-color="#060f1a"/>
      <stop offset="70%" stop-color="#0a1620"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <!-- Radial glow for center focus -->
    <radialGradient id="centerGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Text gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <!-- Subtitle gradient -->
    <linearGradient id="subtitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    
    <!-- Accent line gradient -->
    <linearGradient id="accentLineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="15%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="85%" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Secondary accent (amber) -->
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Text glow -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft glow for elements -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle noise pattern -->
    <pattern id="noisePattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0f172a"/>
      <circle cx="0" cy="0" r="0.5" fill="#1e293b" opacity="0.3"/>
      <circle cx="4" cy="4" r="0.5" fill="#1e293b" opacity="0.3"/>
    </pattern>
    
    <!-- Fine grid pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    
    <!-- Circuit trace pattern -->
    <pattern id="circuitPattern" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="1" fill="#38bdf8" opacity="0.12"/>
      <path d="M 60 0 L 60 25 M 60 95 L 60 120 M 0 60 L 25 60 M 95 60 L 120 60" 
            fill="none" stroke="#38bdf8" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    
    <!-- Accent button gradient -->
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    
    <!-- Badge accent -->
    <linearGradient id="badgeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.02"/>
    </linearGradient>
    
    <!-- Section divider gradient -->
    <linearGradient id="sectionDivider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="25%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="1"/>
      <stop offset="75%" stop-color="#0ea5e9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Card hover glow -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background layers -->
  <rect width="1200" height="320" fill="url(#bgGradient)"/>
  <rect width="1200" height="320" fill="url(#noisePattern)"/>
  <rect width="1200" height="320" fill="url(#gridPattern)"/>
  <rect width="1200" height="320" fill="url(#circuitPattern)"/>
  <ellipse cx="600" cy="100" rx="400" ry="120" fill="url(#centerGlow)"/>
  
  <!-- Subtle top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentLineGradient)" stroke-width="1.5"/>
  
  <!-- Left decorative system node -->
  <g opacity="0.12" filter="url(#softGlow)">
    <circle cx="100" cy="100" r="55" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-dasharray="10 15"/>
    <circle cx="100" cy="100" r="38" fill="none" stroke="#0ea5e9" stroke-width="0.8" stroke-dasharray="6 10"/>
    <circle cx="100" cy="100" r="18" fill="none" stroke="#0ea5e9" stroke-width="0.6" stroke-dasharray="3 6"/>
    <circle cx="100" cy="100" r="6" fill="#0ea5e9" opacity="0.4"/>
    <circle cx="100" cy="100" r="2" fill="#0ea5e9" opacity="0.9"/>
  </g>
  
  <!-- Right decorative system node -->
  <g opacity="0.12" filter="url(#softGlow)" transform="translate(1100, 220)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="8 12"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#0ea5e9" stroke-width="0.7" stroke-dasharray="5 8"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#0ea5e9" stroke-width="0.5" stroke-dasharray="3 5"/>
    <circle cx="0" cy="0" r="5" fill="#0ea5e9" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.5" fill="#0ea5e9" opacity="0.9"/>
  </g>
  
  <!-- Central connecting path with nodes -->
  <g stroke="#0ea5e9" stroke-width="0.6" opacity="0.15" stroke-dasharray="5 10" filter="url(#softGlow)">
    <path d="M 155 100 Q 300 80 450 110 Q 600 140 750 170 Q 900 200 1045 220" fill="none"/>
  </g>
  
  <!-- Nodes along the path -->
  <g fill="#0ea5e9" opacity="0.3" filter="url(#softGlow)">
    <circle cx="300" cy="80" r="3"/>
    <circle cx="450" cy="110" r="2.5"/>
    <circle cx="600" cy="140" r="3"/>
    <circle cx="750" cy="170" r="2.5"/>
    <circle cx="900" cy="200" r="3"/>
  </g>
  
  <!-- Data flow particles -->
  <g fill="#0ea5e9" opacity="0.5" filter="url(#softGlow)">
    <circle cx="220" cy="95" r="1.5"/>
    <circle cx="380" cy="95" r="1.5"/>
    <circle cx="530" cy="125" r="1.5"/>
    <circle cx="680" cy="155" r="1.5"/>
    <circle cx="830" cy="185" r="1.5"/>
    <circle cx="980" cy="210" r="1.5"/>
  </g>
  
  <!-- Floating data packets -->
  <g fill="#f59e0b" opacity="0.4" filter="url(#softGlow)">
    <rect x="250" y="85" width="3" height="3" rx="0.5"/>
    <rect x="420" y="100" width="2.5" height="2.5" rx="0.5"/>
    <rect x="580" y="130" width="2" height="2" rx="0.5"/>
    <rect x="730" y="160" width="2.5" height="2.5" rx="0.5"/>
    <rect x="880" y="190" width="2" height="2" rx="0.5"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="110" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="44" font-weight="700" fill="url(#titleGradient)" filter="url(#textGlow)" letter-spacing="-0.6px" paint-order="stroke fill">
    Aathish Rao A B
  </text>
  
  <!-- Role tagline -->
  <text x="600" y="152" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="18" font-weight="400" fill="url(#subtitleGradient)" letter-spacing="0.3px" paint-order="stroke fill">
    AI & Systems Engineer
  </text>
  
  <!-- Divider under role -->
  <line x1="480" y1="162" x2="720" y2="162" stroke="url(#accentLineGradient)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Subtitle/description -->
  <text x="600" y="192" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.2px" width="820" paint-order="stroke fill">
    Building reliable AI systems, high-performance software, and measurable ML infrastructure.
  </text>
  
  <!-- Link badges -->
  <g transform="translate(320, 225)">
    <!-- GitHub badge -->
    <g class="badge" transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="38" rx="10" fill="url(#badgeAccent)" stroke="#1e293b" stroke-width="1" filter="url(#softGlow)"/>
      <text x="85" y="24" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="12" font-weight="600" fill="#e2e8f0" font-feature-settings="'liga' off">
        GitHub
      </text>
      <!-- GitHub icon -->
      <g fill="#0ea5e9" transform="translate(18, 10)">
        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.4-1.11-1.4-.91-.6.07-.6.07-.6 1 .07 1.03 1.03 1.03 1.03.59 1.01 1.3 1.64 1.64 1.64 1.46 0 2.23-.97 2.23-2.16 0-1.09-.66-2.01-1.55-2.41-.15-.23-.67-1.16.15-2.42 0 0 1.22-.46 4 1.8 1.16-.39 2.4-.59 3.66-.59s2.5.2 3.66.59c2.78-2.26 4-1.8 4-1.8.82 1.26.19 2.19.14 2.42-.89.4-1.55 1.31-1.55 2.41 0 1.27-.97 2.15-2.23 2.15-.69 0-1.25-.39-1.6-1.01v1.52c0 .4.26.87.7.77C19.93 19.5 22 15.75 22 12c0-5.52-4.48-10-10-10z" fill="#0ea5e9" transform="scale(0.35) translate(-6, -6)"/>
      </g>
      <text x="85" y="24" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="12" font-weight="600" fill="#c9d1d9" font-feature-settings="'liga' off">
        GitHub
      </text>
      
      <!-- LinkedIn badge -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="170" height="38" rx="10" fill="#0a66c2" opacity="0.15" stroke="#1e293b" stroke-width="1" filter="url(#softGlow)"/>
        <text x="85" y="24" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
              font-size="12" font-weight="600" fill="#c9d1d9" font-feature-settings="'liga' off">
          LinkedIn
        </text>
        <g fill="#0a66c2" transform="translate(18, 10) scale(0.35)">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-1.852 3.037v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.92 3.356-1.92 3.583 0 4.267 2.35 4.267 5.421v5.898zM4.842 7.236c1.175 0 2.132-.944 2.132-2.114 0-1.17-.957-2.133-2.132-2.133-1.177 0-2.133.964-2.133 2.133 0 1.171.956 2.114 2.133 2.114zM20.533 21.638H9.351V9h11.182v12.638zM4.842 21.638H2.42V9h2.422v12.638zM22.956 0H1.044C.467 0 0 .465 0 1.043v21.528C0 23.135.467 23.6 1.044 23.6h21.912c.578 0 1.044-.465 1.044-1.043V1.043C24 1.465 23.533 0 22.956 0z" fill="#0a66c2" transform="scale(0.3) translate(-4, -4)"/>
        </g>
        <text x="85" y="24" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
              font-size="12" font-weight="600" fill="#c9d1d9" font-feature-settings="'liga' off">
          LinkedIn
        </text>
      </g>
      
      <!-- Email badge -->
      <g transform="translate(380, 0)">
        <rect x="0" y="0" width="170" height="38" rx="10" fill="#ea4335" opacity="0.12" stroke="#1e293b" stroke-width="1" filter="url(#softGlow)"/>
        <text x="85" y="24" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
              font-size="12" font-weight="600" fill="#c9d1d9" font-feature-settings="'liga' off">
          Email
        </text>
        <g fill="#ea4335" transform="translate(18, 10) scale(0.35)">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 8-8-8 8-8 8 8-8 8 8-8z" fill="#ea4335"/>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Bottom accent nodes -->
  <g fill="#0ea5e9" opacity="0.12">
    <circle cx="150" cy="305" r="2"/>
    <circle cx="300" cy="308" r="1.5"/>
    <circle cx="450" cy="305" r="2"/>
    <circle cx="600" cy="308" r="1.5"/>
    <circle cx="750" cy="305" r="2"/>
    <circle cx="900" cy="308" r="1.5"/>
    <circle cx="1050" cy="305" r="2"/>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="100" y1="318" x2="1100" y2="318" stroke="url(#accentLineGradient)" stroke-width="1" opacity="0.4"/>
  
</svg>