<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    
    <!-- Accent gradient for text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#a5d6ff"/>
    </linearGradient>
    
    <!-- Accent line gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="80%" stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Subtle glow for text -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Grid pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    
    <!-- Circuit pattern -->
    <pattern id="circuitPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.5" fill="#58a6ff" opacity="0.15"/>
      <path d="M 40 0 L 40 20 M 40 60 L 40 80 M 0 40 L 20 40 M 60 40 L 80 40" 
            fill="none" stroke="#58a6ff" stroke-width="0.4" opacity="0.1"/>
    </pattern>
    
    <!-- Subtitle gradient -->
    <linearGradient id="subtitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b949e"/>
      <stop offset="50%" stop-color="#a5d6ff"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="280" fill="url(#bgGradient)"/>
  <rect width="1200" height="280" fill="url(#gridPattern)"/>
  <rect width="1200" height="280" fill="url(#circuitPattern)"/>
  
  <!-- Subtle top accent line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#accentGradient)" stroke-width="2"/>
  
  <!-- Left decorative circuit element -->
  <g opacity="0.15">
    <circle cx="80" cy="80" r="40" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="8 12"/>
    <circle cx="80" cy="80" r="28" fill="none" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="4 8"/>
    <circle cx="80" cy="80" r="12" fill="#58a6ff" opacity="0.3"/>
    <circle cx="80" cy="80" r="4" fill="#58a6ff"/>
  </g>
  
  <!-- Right decorative circuit element -->
  <g opacity="0.15" transform="translate(1120, 200)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="6 10"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#58a6ff" stroke-width="0.8" stroke-dasharray="3 6"/>
    <circle cx="0" cy="0" r="10" fill="#58a6ff" opacity="0.3"/>
    <circle cx="0" cy="0" r="3" fill="#58a6ff"/>
  </g>
  
  <!-- Central connecting line between decorative elements -->
  <line x1="120" y1="80" x2="1080" y2="200" stroke="#58a6ff" stroke-width="0.5" opacity="0.08" stroke-dasharray="4 8"/>
  
  <!-- Small node indicators along the line -->
  <g fill="#58a6ff" opacity="0.2">
    <circle cx="280" cy="110" r="2"/>
    <circle cx="480" cy="135" r="1.5"/>
    <circle cx="680" cy="160" r="2"/>
    <circle cx="880" cy="185" r="1.5"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="115" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" 
        font-size="42" font-weight="700" fill="url(#textGradient)" filter="url(#textGlow)" letter-spacing="-0.5px">
    Aathish Rao A B
  </text>
  
  <!-- Role tagline -->
  <text x="600" y="155" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" 
        font-size="18" font-weight="400" fill="url(#subtitleGradient)" letter-spacing="0.5px">
    AI & Systems Engineer
  </text>
  
  <!-- Divider line under role -->
  <line x1="450" y1="165" x2="750" y2="165" stroke="#58a6ff" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 4"/>
  
  <!-- Subtitle/description -->
  <text x="600" y="195" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif" 
        font-size="15" font-weight="400" fill="#8b949e" letter-spacing="0.3px" width="800">
    Building reliable AI systems, high-performance software, and measurable ML infrastructure.
  </text>
  
  <!-- Link badges container -->
  <g transform="translate(350, 225)">
    <!-- GitHub badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="180" height="36" rx="8" fill="url(#textGradient)" opacity="0.05"/>
      <text x="90" y="23" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="12" font-weight="600" fill="#c9d1d9" font-feature-settings="'liga' off">
        GitHub
      </text>
      <circle cx="15" cy="18" r="6" fill="#58a6ff" opacity="0.2"/>
      <path d="M12 15 Q15 13 18 15 Q21 18 18 21 Q15 24 12 21 Z" fill="#58a6ff" opacity="0.8"/>
    </g>
    
    <!-- LinkedIn badge -->
    <g transform="translate(200, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#0a66c2" opacity="0.1"/>
      <text x="90" y="23" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="12" font-weight="600" fill="#c9d1d9" font-feature-settings="'liga' off">
        LinkedIn
      </text>
      <circle cx="15" cy="18" r="6" fill="#0a66c2" opacity="0.2"/>
      <path d="M18 13 L15 13 L15 23 L18 23 Z M23 13 L26 13 L26 23 L23 23 Z M13 18 L13 21 L16 21 L16 18 Z" fill="#0a66c2" opacity="0.9"/>
    </g>
    
    <!-- Email badge -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#ea4335" opacity="0.1"/>
      <text x="90" y="23" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
            font-size="12" font-weight="600" fill="#c9d1d9" font-feature-settings="'liga' off">
        Email
      </text>
      <circle cx="15" cy="18" r="6" fill="#ea4335" opacity="0.2"/>
      <path d="M12 15 L18 20 L24 15 M12 15 L24 15 M12 21 L24 21" fill="none" stroke="#ea4335" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Bottom accent line -->
  <line x1="0" y1="278" x2="1200" y2="278" stroke="url(#accentGradient)" stroke-width="1" opacity="0.5"/>
  
  <!-- Bottom decorative nodes -->
  <g fill="#58a6ff" opacity="0.15">
    <circle cx="200" cy="270" r="1.5"/>
    <circle cx="400" cy="272" r="1"/>
    <circle cx="600" cy="270" r="1.5"/>
    <circle cx="800" cy="272" r="1"/>
    <circle cx="1000" cy="270" r="1.5"/>
  </g>
</svg>