<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="proofBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2a" stop-opacity="0.9"/>
      <stop offset("100%") stop-color="#061420" stop-opacity="0.9"/>
    </linearGradient>
    
    <linearGradient id="accentCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.02"/>
    </linearGradient>
    
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>
    
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.08"/>
    </filter>
    
    <filter id="metricGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="metricGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="metricGlowRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="380" fill="url(#proofBg)"/>
  
  <!-- Section header -->
  <text x="600" y="55" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" font-weight="700" fill="#e2e8f0" filter="url(#textGlow)" letter-spacing="-0.5px">
    ENGINEERING PROOF
  </text>
  
  <text x="600" y="85" text-anchor="middle" font-family="SF Pro Display, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="14" font-weight="400" fill="#64748b" letter-spacing="0.3px">
  Verified engineering signals across all flagship projects
  </text>
  
  <!-- Divider -->
  <line x1="300" y1="100" x2="900" y2="100" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 8"/>
  
  <!-- Row 1: Core metrics -->
  <g transform="translate(80, 130)">
    <!-- Metric 1: Behavioral Parity -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#0ea5e9" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#0ea5e9" filter="url(#metricGlow)">35/50</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#0ea5e9" letter-spacing="0.5px" text-transform="uppercase">BEHAVIORAL PARITY</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">35/50 exact behavioral matches</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">15 documented differences · zero correctness bugs</text>
      
      <!-- Link indicator -->
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#0ea5e9" opacity="0.8">Parity Report →</text>
    </g>
    
    <!-- Metric 2: Differential Tests -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#f59e0b" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" filter="url(#metricGlow)">50</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="0.5px" text-transform="uppercase">DIFFERENTIAL TESTS</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">50 test cases vs Python natsort</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">Differential fuzzing · zero crashes</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#f59e0b" opacity="0.8">Differential Report →</text>
    </g>
    
    <!-- Metric 3: Test Coverage -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#10b981" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#10b981" filter="url(#metricGlow)">85</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#10b981" letter-spacing="0.5px" text-transform="uppercase">TEST COVERAGE</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">47 unit + 7 integration + 25 fuzz + 6 doctest</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">Property-based fuzzing · 1000+ iterations</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#10b981" opacity="0.8">Fuzz Report →</text>
    </g>
  </g>
  
  <!-- Row 2: Architecture & Benchmarks -->
  <g transform="translate(80, 255)">
    <!-- Metric 4: Architecture Decisions -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#8b5cf6" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#8b5cf6" filter="url(#metricGlow)">20</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#8b5cf6" letter-spacing="0.5px" text-transform="uppercase">ARCHITECTURE DECISIONS</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">20 ADRs documenting every divergence</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">From Python natsort with rationale</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#8b5cf6" opacity="0.8">Decisions Log →</text>
    </g>
    
    <!-- Metric 5: Benchmarks -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#ec4899" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#ec4899" filter="url(#metricGlow)">2–11×</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#ec4899" letter-spacing="0.5px" text-transform="uppercase">BENCHMARK SPEEDUP</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">Criterion + hyperfine · p99/RSS measured</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">vs Python natsort 8.4.0 · LTO optimized</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#ec4899" opacity="0.8">Benchmark Report →</text>
    </g>
    
    <!-- Metric 6: Unicode Support -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#14b8a6" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#14b8a6" filter="url(#metricGlow)">15.1</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#14b8a6" letter-spacing="0.5px" text-transform="uppercase">UNICODE SUPPORT</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">770 decimals · 1009 digits · 1955 numeric</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">15+ scripts · Generated from UCD at build</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#14b8a6" opacity="0.8">Unicode Tables →</text>
    </g>
  </g>
  
  <!-- Row 3: Cross-project signals -->
  <g transform="translate(80, 255)">
    <!-- Metric 7: RL Environment -->
    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#f97316" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#f97316" filter="url(#metricGlow)">Gym</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#f97316" letter-spacing="0.5px" text-transform="uppercase">RL ENVIRONMENT</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">Gymnasium/OpenEnv compliant · MultiDiscrete</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">3 task tiers · 5 assets · HF Spaces deployed</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#f97316" opacity="0.8">HF Space →</text>
    </g>
    
    <!-- Metric 8: LLM Evaluation -->
    <g transform="translate(370, 125)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#d946ef" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#d946ef" filter="url(#metricGlow)">5</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#d946ef" letter-spacing="0.5px" text-transform="uppercase">TRUST DIMENSIONS</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">Fact, Hallucination, Similarity, Quality, Safety</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">Multi-LLM adapters · MLflow · Streamlit</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#d946ef" opacity="0.8">Architecture →</text>
    </g>
    
    <!-- Metric 9: Blockchain Deployment -->
    <g transform="translate(740, 125)">
      <rect x="0" y="0" width="340" height="100" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" filter="url(#cardShadow)"/>
      <rect x="0" y="0" width="340" height="4" rx="14" fill="#f59e0b" opacity="0.8"/>
      
      <circle cx="35" cy="30" r="20" fill="url(#metricGlowRadial)" filter="url(#metricGlow)" opacity="0.8"/>
      <text x="35" y="35" text-anchor="middle" font-family="SF Pro Display, sans-serif" font-size="14" font-weight="700" fill="#f59e0b" filter="url(#metricGlow)">4</text>
      
      <text x="65" y="25" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="600" fill="#f59e0b" letter-spacing="0.5px" text-transform="uppercase">SEPOLIA CONTRACTS</text>
      <text x="65" y="42" font-family="SF Pro Display, sans-serif" font-size="13" font-weight="400" fill="#c9d1d9">ERC721/ERC20 · Vercel frontend · Verified</text>
      <text x="65" y="58" font-family="SF Pro Display, sans-serif" font-size="11" font-weight="400" fill="#64748b">Hardhat v3 · Viem · OpenZeppelin</text>
      
      <text x="280" y="90" font-family="SF Pro Display, sans-serif" font-size="10" font-weight="500" fill="#f59e0b" opacity="0.8">Etherscan →</text>
    </g>
  </g>
  
  <!-- Footer accent -->
  <line x1="150" y1="365" x2="1050" y2="365" stroke="url(#dividerGrad)" stroke-width="1" opacity="0.4"/>
  <circle cx="600" cy="365" r="50" fill="#0ea5e9" opacity="0.08" filter="url(#softGlow)"/>
  <g fill="#0ea5e9" opacity="0.3">
    <circle cx="300" cy="365" r="2"/>
    <circle cx="900" cy="365" r="2"/>
    <circle cx="400" cy="363" r="1.5"/>
    <circle cx="800" cy="367" r="1.5"/>
  </g>
</svg>